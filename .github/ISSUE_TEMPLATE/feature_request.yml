name: Feature request
description: Suggest something Lifeline should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What Lifeline could do about it.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Other ways you tried, or screenshots.
